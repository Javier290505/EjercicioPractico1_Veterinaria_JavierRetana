<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${servicio.id == null} 
            ? 'Agregar Servicio' 
            : 'Editar Servicio'">
        Servicio
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4"
        th:text="${servicio.id == null} 
        ? 'Agregar Servicio' 
        : 'Editar Servicio'">
    </h2>


    <form th:action="@{/servicios/guardar}"
          th:object="${servicio}"
          method="post">

        <!-- ID -->
        <input type="hidden"
               th:field="*{id}">


        <!-- Nombre -->
        <div class="mb-3">

            <label for="nombre"
                   class="form-label">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   id="nombre"
                   th:field="*{nombre}"
                   required>

        </div>


        <!-- Precio -->
        <div class="mb-3">

            <label for="precio"
                   class="form-label">
                Precio
            </label>

            <input type="number"
                   class="form-control"
                   id="precio"
                   th:field="*{precio}"
                   min="0"
                   step="0.01"
                   required>

        </div>


        <!-- Duración -->
        <div class="mb-3">

            <label for="duracionMinutos"
                   class="form-label">
                Duración en minutos
            </label>

            <input type="number"
                   class="form-control"
                   id="duracionMinutos"
                   th:field="*{duracionMinutos}"
                   min="1"
                   required>

        </div>


        <!-- Tipo de servicio -->
        <div class="mb-3">

            <label for="tipoServicio"
                   class="form-label">
                Tipo de Servicio
            </label>

            <select class="form-select"
                    id="tipoServicio"
                    th:field="*{tipoServicio.id}"
                    required>

                <option value="">
                    Seleccione un tipo
                </option>

                <option th:each="tipo : ${tipos}"
                        th:value="${tipo.id}"
                        th:text="${tipo.nombre}">
                </option>

            </select>

        </div>


        <!-- Botones -->
        <button type="submit"
                class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/servicios}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
