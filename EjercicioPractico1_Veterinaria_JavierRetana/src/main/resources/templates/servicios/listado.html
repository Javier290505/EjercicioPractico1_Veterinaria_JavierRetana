<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Servicios Veterinarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Servicios Veterinarios</h2>

        <a th:href="@{/servicios/nuevo}"
           class="btn btn-primary">
            Agregar Servicio
        </a>

    </div>


    <!-- Mensaje de éxito -->
    <div th:if="${mensaje}"
         class="alert alert-success"
         th:text="${mensaje}">
    </div>


    <!-- Tabla de servicios -->
    <table class="table table-striped table-bordered">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Duración</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="servicio : ${servicios}">

                <td th:text="${servicio.id}"></td>

                <td th:text="${servicio.nombre}"></td>

                <td th:text="${servicio.tipoServicio.nombre}"></td>

                <td th:text="${'₡' + servicio.precio}"></td>

                <td th:text="${servicio.duracionMinutos + ' minutos'}"></td>

                <td>

                    <!-- EDITAR -->
                    <a th:href="@{/servicios/editar(id=${servicio.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>


                    <!-- ELIMINAR -->
                    <form th:action="@{/servicios/eliminar}"
                          method="post"
                          style="display:inline;">

                        <input type="hidden"
                               name="id"
                               th:value="${servicio.id}">

                        <button type="submit"
                                class="btn btn-danger btn-sm">
                            Eliminar
                        </button>

                    </form>

                </td>

            </tr>

        </tbody>

    </table>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
