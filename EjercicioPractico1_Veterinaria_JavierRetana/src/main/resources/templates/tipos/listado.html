<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Tipos de Servicio</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body>

        <div class="container mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Tipos de Servicio</h2>

                <a th:href="@{/tipos/nuevo}" class="btn btn-primary">
                    Agregar Tipo
                </a>
            </div>

            <div th:if="${mensaje}" 
                 class="alert alert-success"
                 th:text="${mensaje}">
            </div>

            <table class="table table-striped table-bordered">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Cantidad de Servicios</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="tipo : ${tipos}">

                        <td th:text="${tipo.id}"></td>

                        <td th:text="${tipo.nombre}"></td>

                        <td th:text="${tipo.descripcion}"></td>

                        <td th:text="${tipo.servicios.size()}"></td>

                        <td>
                            <a th:href="@{/tipos/editar(id=${tipo.id})}"
                               class="btn btn-warning btn-sm">
                                Editar
                            </a>

                            <button type="button"
                                    class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalEliminar"
                                    th:attr="data-id=${tipo.id},
                                    data-nombre=${tipo.nombre}">
                                Eliminar
                            </button>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
