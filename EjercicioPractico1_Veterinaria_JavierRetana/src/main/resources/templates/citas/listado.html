<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Citas Veterinarias</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="d-flex flex-column min-vh-100">

        <div th:replace="~{fragmentos/navbar :: navbar}"></div>

        <div th:replace="~{fragmentos/header :: header}"></div>

        <div class="container mt-5 flex-grow-1">

            <div class="mb-4">
                <h2>Citas Veterinarias</h2>
                <p class="text-muted">
                    Listado de citas registradas en el sistema
                </p>
            </div>

            <!-- Tabla de citas -->
            <table class="table table-striped table-bordered">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Mascota</th>
                        <th>Propietario</th>
                        <th>Fecha</th>
                        <th>Servicio</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="cita : ${citas}">

                        <td th:text="${cita.id}"></td>

                        <td th:text="${cita.nombreMascota}"></td>

                        <td th:text="${cita.nombrePropietario}"></td>

                        <td th:text="${cita.fecha}"></td>

                        <td th:text="${cita.servicio.nombre}"></td>

                    </tr>

                </tbody>

            </table>

        </div>

        <div th:replace="~{fragmentos/footer :: footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
